[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnj-processual"
version = "0.1.0"
description = "Servidor MCP para consulta processual judicial brasileira via APIs públicas do CNJ (DataJud e DJEN)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=46,<51",
    "mcp>=1.30,<2",  # streamable_http_app (modo HTTP) testado com 1.30
    "httpx>=0.27",
    "apscheduler>=3.10,<4",  # verificação periódica de monitoramentos (modo HTTP)
]

[tool.setuptools]
py-modules = ["server", "db", "_util", "google_integracao", "agenda_atividades", "notificacoes", "monitoramento_runtime", "asaas_integracao", "integracoes", "integracoes_http"]
