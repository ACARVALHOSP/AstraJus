name: Deploy Radix (C)

on:
  push:
    branches: [astrajus-radix]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-radix
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifica sintaxe Python
        run: python3 -m py_compile server.py db.py _util.py google_integracao.py agenda_atividades.py notificacoes.py monitoramento_runtime.py asaas_integracao.py integracoes.py integracoes_http.py

      - name: Instala dependências e builda frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configura chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Copia arquivos estáticos para o VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "admin@${{ secrets.VPS_HOST }}" \
            "sudo mkdir -p /srv/astrajus-radix/current /srv/astrajus-radix/assets"
          rsync -a --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            frontend/dist/assets/ "admin@${{ secrets.VPS_HOST }}:/tmp/radix-assets/"
          rsync -a --delete --exclude assets -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            frontend/dist/ "admin@${{ secrets.VPS_HOST }}:/tmp/radix-current/"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "admin@${{ secrets.VPS_HOST }}" '
            sudo rsync -a --delete /tmp/radix-assets/ /srv/astrajus-radix/assets/
            sudo rsync -a --delete /tmp/radix-current/ /srv/astrajus-radix/current/
            sudo systemctl reload caddy
          '

      - name: Checa saúde do servidor
        run: |
          sleep 2
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" https://191-252-110-22.sslip.io/radix/
