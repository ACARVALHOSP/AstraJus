name: Deploy Radix (C)

on:
  push:
    branches: [astrajus-radix]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-radix
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifica sintaxe Python
        run: python3 -m py_compile server.py db.py _util.py google_integracao.py agenda_atividades.py notificacoes.py monitoramento_runtime.py asaas_integracao.py integracoes.py integracoes_http.py

      - name: Configura chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via SSH (git pull + build frontend + atualiza estáticos)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "admin@${{ secrets.VPS_HOST }}" '
            set -e

            echo "== git pull =="
            sudo git -C /root/apps/astrajus-radix pull --ff-only origin astrajus-radix

            echo "== build frontend =="
            cd /root/apps/astrajus-radix/frontend
            sudo npm ci --prefer-offline
            sudo npm run build

            echo "== deploy arquivos estáticos =="
            sudo mkdir -p /srv/astrajus-radix/assets
            sudo rsync -a --delete dist/assets/ /srv/astrajus-radix/assets/
            sudo rsync -a --delete --exclude assets dist/ /srv/astrajus-radix/current/

            echo "== reload caddy =="
            sudo systemctl reload caddy

            echo "== status =="
            curl -fsS -o /dev/null -w "HTTP %{http_code}\n" https://191-252-110-22.sslip.io/radix/
          '
