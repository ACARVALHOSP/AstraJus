name: Deploy frontend React

on:
  push:
    branches: [astrajus-react]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-frontend-react
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/astrajus-react'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build somente do frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          printf '%s\n' "$GITHUB_SHA" > dist/release.txt
          tar -czf "/tmp/astrajus-frontend-${GITHUB_SHA}.tar.gz" -C dist .
          cd /tmp
          sha256sum "astrajus-frontend-${GITHUB_SHA}.tar.gz" > "astrajus-frontend-${GITHUB_SHA}.tar.gz.sha256"
      - name: Configura SSH com identidade do servidor verificada
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 0600 ~/.ssh/deploy_key
          cp frontend/deploy/known_hosts ~/.ssh/known_hosts
      - name: Envia arquivos e publica sem reiniciar o backend
        run: |
          scp -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "/tmp/astrajus-frontend-${GITHUB_SHA}.tar.gz" \
            "/tmp/astrajus-frontend-${GITHUB_SHA}.tar.gz.sha256" \
            frontend/deploy/publish.sh "${VPS_USER}@${VPS_HOST}:/tmp/"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" "sudo -n bash /tmp/publish.sh '$GITHUB_SHA'"
      - name: Remove chave temporária do runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
